spring:
  application:
    name: flow-policy
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flow_policy}
    username: ${DB_USER:flow}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 0B
app:
  upload-root: ${UPLOAD_ROOT:./uploads}
server:
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
