spring:
  application:
    name: flow-policy
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flow_policy}
    username: ${DB_USER:flow}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
  sql:
    init:
      mode: never
server:
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
