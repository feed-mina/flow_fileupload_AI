spring:
  application:
    name: flow-policy
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flow_policy}
    username: ${DB_USER:flow}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 0B
app:
  upload-root: ${UPLOAD_ROOT:./uploads}
server:
  tomcat:
    # Consume a rejected body within the finite request envelope so a client
    # can receive the JSON 413 rather than a broken pipe from the default 2 MiB.
    max-swallow-size: 12MB
    max-http-form-post-size: 12MB
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
