spring:
  application:
    name: flow-policy
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flow_policy}
    username: ${DB_USER:flow}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 0B
app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:}
  demo-user: ${DEMO_AUTH_USER:}
  demo-password: ${DEMO_AUTH_PASSWORD:}
  upload-root: ${UPLOAD_ROOT:./uploads}
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
  tomcat:
    # Consume a rejected body within the finite request envelope so a client
    # can receive the JSON 413 rather than a broken pipe from the default 2 MiB.
    max-swallow-size: 12MB
    max-http-form-post-size: 12MB
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: logstash
