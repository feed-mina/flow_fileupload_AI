server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;
  error_page 413 = @too_large;
  location @too_large {
    default_type application/json;
    return 413 '{"error":{"code":"UPLOAD_SIZE_LIMIT","message":"파일은 10 MiB, 전체 요청은 12 MiB 이하여야 합니다.","requestId":"$request_id"}}';
  }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location /api/ { proxy_set_header Host $http_host; proxy_pass http://backend:8080; proxy_connect_timeout 5s; proxy_read_timeout 60s; }
  location / { try_files $uri $uri/ /index.html; }
}
