name: Policy and DEC upload validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: flow_smoke
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flow -d flow_smoke"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/flow_smoke
      DB_USER: flow
      DB_PASSWORD: ci-disposable-password
      PGPASSWORD: ci-disposable-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Backend PostgreSQL integration tests
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend API tests and production build
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: Verify runner-provided Chrome
        run: google-chrome --version
      - name: T01-T04 real process restart test
        run: node scripts/verify-restart.mjs
      - name: Create isolated browser database
        run: psql -h 127.0.0.1 -U flow -d flow_smoke -c 'CREATE DATABASE flow_browser;'
      - name: Browser tests
        working-directory: frontend
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/flow_browser
          PLAYWRIGHT_CHANNEL: chrome
        run: npm run test:e2e
      - name: Report interaction and layout
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: node e2e/report-check.mjs
      - name: Validate Docker configuration
        env:
          POSTGRES_PASSWORD: ci-disposable-password
        run: APP_DB_PASSWORD=ci-disposable-app-password docker compose config --quiet
      - name: Nginx UX error contract
        run: |
          docker run -d --rm --name ux-proxy --add-host backend:127.0.0.1 -p 127.0.0.1:18081:80 -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
          trap 'docker rm -f ux-proxy' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:18081/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-proxy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-test-evidence
          path: |
            backend/target/surefire-reports
            test-results
            frontend/playwright-report
            frontend/test-results
            frontend/package-lock.json
