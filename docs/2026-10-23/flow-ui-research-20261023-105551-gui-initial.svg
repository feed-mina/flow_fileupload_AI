<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="파일 업로드 과제 개선 예상 GUI"><title>파일 업로드 정책 - 최초 상태</title><g font-family="Malgun Gothic,Segoe UI,sans-serif"><rect x="0" y="0" width="1400" height="900" rx="0" fill="#f4f5fb" stroke="#f4f5fb"/><rect x="24" y="20" width="1352" height="860" rx="18" fill="#f7f8fc" stroke="#cfd5e4"/><rect x="24" y="20" width="1352" height="72" rx="18" fill="#fff" stroke="#e0e4ed"/><text x="52" y="65" font-size="24" fill="#24304a" font-weight="700">파일 업로드 정책</text><text x="1175" y="65" font-size="18" fill="#5f4ca6" font-weight="400">개선 예상 모형</text><text x="62" y="148" font-size="31" fill="#24304a" font-weight="700">파일을 보내기 전에, 차단 규칙부터 확인하세요.</text><text x="62" y="189" font-size="20" fill="#596980" font-weight="400">선택한 확장자는 파일 전송 시 서버에서 확인합니다.</text><rect x="52" y="230" width="676" height="558" rx="12" fill="#fff" stroke="#dce2ed"/><rect x="750" y="230" width="598" height="558" rx="12" fill="#fff" stroke="#dce2ed"/><text x="78" y="274" font-size="24" fill="#24304a" font-weight="700">01 차단 정책</text><text x="580" y="274" font-size="18" fill="#5c4a9e" font-weight="400">초기 상태</text><text x="78" y="326" font-size="21" fill="#24304a" font-weight="700">고정 확장자</text><rect x="78" y="349" width="126" height="44" rx="7" fill="#f8f9fc" stroke="#d9dfec"/><rect x="90" y="361" width="18" height="18" rx="4" fill="#fff" stroke="#9aa6bd"/><text x="118" y="378" font-size="19" fill="#24304a" font-weight="400">bat</text><rect x="223" y="349" width="126" height="44" rx="7" fill="#f8f9fc" stroke="#d9dfec"/><rect x="235" y="361" width="18" height="18" rx="4" fill="#fff" stroke="#9aa6bd"/><text x="263" y="378" font-size="19" fill="#24304a" font-weight="400">cmd</text><rect x="368" y="349" width="126" height="44" rx="7" fill="#f8f9fc" stroke="#d9dfec"/><rect x="380" y="361" width="18" height="18" rx="4" fill="#fff" stroke="#9aa6bd"/><text x="408" y="378" font-size="19" fill="#24304a" font-weight="400">com</text><rect x="513" y="349" width="126" height="44" rx="7" fill="#f8f9fc" stroke="#d9dfec"/><rect x="525" y="361" width="18" height="18" rx="4" fill="#fff" stroke="#9aa6bd"/><text x="553" y="378" font-size="19" fill="#24304a" font-weight="400">cpl</text><rect x="78" y="407" width="126" height="44" rx="7" fill="#f8f9fc" stroke="#d9dfec"/><rect x="90" y="419" width="18" height="18" rx="4" fill="#fff" stroke="#9aa6bd"/><text x="118" y="436" font-size="19" fill="#24304a" font-weight="400">exe</text><rect x="223" y="407" width="126" height="44" rx="7" fill="#f8f9fc" stroke="#d9dfec"/><rect x="235" y="419" width="18" height="18" rx="4" fill="#fff" stroke="#9aa6bd"/><text x="263" y="436" font-size="19" fill="#24304a" font-weight="400">scr</text><rect x="368" y="407" width="126" height="44" rx="7" fill="#f8f9fc" stroke="#d9dfec"/><rect x="380" y="419" width="18" height="18" rx="4" fill="#fff" stroke="#9aa6bd"/><text x="408" y="436" font-size="19" fill="#24304a" font-weight="400">js</text><text x="78" y="489" font-size="18" fill="#647187" font-weight="400">처음에는 모두 미선택입니다.</text><path d="M78 516H702" stroke="#e0e5ee"/><text x="78" y="554" font-size="21" fill="#24304a" font-weight="700">커스텀 확장자</text><text x="620" y="554" font-size="18" fill="#5b6780" font-weight="400">0/200</text><rect x="78" y="578" width="486" height="48" rx="8" fill="#fff" stroke="#cbd3e1"/><text x="94" y="609" font-size="19" fill="#6b778c" font-weight="400">확장자 입력</text><rect x="578" y="578" width="124" height="48" rx="8" fill="#5c47c7" stroke="#5c47c7"/><text x="620" y="609" font-size="19" fill="#fff" font-weight="400">추가</text><text x="78" y="662" font-size="18" fill="#647187" font-weight="400">최대 20자 · 같은 값은 한 번만</text><text x="78" y="716" font-size="19" fill="#647187" font-weight="400">추가한 확장자가 없습니다.</text><text x="776" y="274" font-size="24" fill="#24304a" font-weight="700">02 파일 업로드</text><text x="1198" y="274" font-size="18" fill="#647187" font-weight="400">미선택</text><rect x="778" y="306" width="542" height="210" rx="12" fill="#faf9ff" stroke="#afa2d7"/><rect x="1026" y="331" width="34" height="44" rx="5" fill="#ece6fd" stroke="#9f8fca"/><text x="958" y="409" font-size="24" fill="#24304a" font-weight="700">파일을 선택하세요</text><text x="909" y="444" font-size="19" fill="#647187" font-weight="400">또는 이곳으로 끌어 놓으세요</text><rect x="981" y="462" width="140" height="40" rx="8" fill="#fff" stroke="#a99bd7"/><text x="1011" y="489" font-size="18" fill="#573ba7" font-weight="400">파일 선택</text><text x="778" y="550" font-size="18" fill="#647187" font-weight="400">1개 · 최대 10 MiB 제안 / 미확정</text><rect x="778" y="572" width="542" height="48" rx="8" fill="#e4e7f0" stroke="#e4e7f0"/><text x="927" y="604" font-size="20" fill="#647187" font-weight="400">파일을 먼저 선택하세요</text><rect x="778" y="646" width="542" height="114" rx="10" fill="#f2f4f8" stroke="#dae1eb"/><text x="800" y="692" font-size="20" fill="#5e6b83" font-weight="400">선택한 파일이 없습니다.</text><text x="62" y="830" font-size="18" fill="#647187" font-weight="400">실제 저장·업로드 기능이 없는 모형입니다. 초기 고정 7종은 모두 미선택입니다.</text></g></svg>